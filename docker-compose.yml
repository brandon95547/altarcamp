# Altar.Camp — the whole platform in three containers.
#   docker compose up --build
#   web  → http://localhost:5190
#   api  → http://localhost:4000  (docs at /docs)
#   db   → localhost:5442

services:
  db:
    image: postgres:17-alpine
    container_name: altar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-altar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-altar_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-altar}
      # Deterministic collation, so ORDER BY does not depend on the host locale.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '${POSTGRES_PORT:-5442}:5432'
    volumes:
      - altar-db-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-altar} -d ${POSTGRES_DB:-altar}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: altar-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Fixed, not taken from .env: that file also configures the API when it runs on the
      # host for development, and a container running in development mode reaches for
      # tooling the production image deliberately does not ship.
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-altar}:${POSTGRES_PASSWORD:-altar_dev_password}@db:5432/${POSTGRES_DB:-altar}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production-at-least-32-chars}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5190}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:5190}
      # Set SEED_DEMO=false for a real deployment.
      SEED_DEMO: ${SEED_DEMO:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@altar.camp}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AltarCampAdmin!2026}
      STORAGE_DIR: /data/storage
      # Mail. MAIL_DRIVER=log writes each email to the log instead of sending it; smtp sends.
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Altar.Camp}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-support@altar.camp}
    ports:
      - '${API_PORT:-4000}:4000'
    volumes:
      - altar-storage:/data/storage

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: altar-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-5190}:80'

volumes:
  altar-db-data:
  altar-storage:
