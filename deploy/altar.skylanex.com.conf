# altar.skylanex.com — Altar.Camp (spec §38, the signing experience)
#
# Deployed to /etc/nginx/conf.d/altar.skylanex.com.conf. Edit it HERE, copy it
# there, `nginx -t`, then `nginx -s reload` (`systemctl reload nginx` can fail
# 226/NAMESPACE on this box).
#
# ---------------------------------------------------------------------------
# Deploying an update
#
#     cd /var/www/altar && git pull --ff-only
#     systemctl restart altar          # rebuilds the images — see altar.service
#
# `.env` is gitignored and lives only on the server (mode 600, secrets generated
# there), so a pull can never overwrite it.
# ---------------------------------------------------------------------------
#
# Unlike archis and ui.skylanex.com, nothing here is served from disk. The app
# is three containers behind 127.0.0.1 (see altar.service) and this file is a
# proxy to two of them: the SPA on :5190 and the API on :4000. The API is
# reached through THIS origin at /api and /docs rather than a second hostname,
# which is what keeps the session cookie first-party — the same arrangement the
# Vite proxy gives the app in development, so the cookie behaves identically in
# both places and CORS never enters into it.
#
# TLS: issued for the bare subdomain through the shared webroot, as archis is.
#
#     certbot certonly --webroot -w /var/www/certbot -d altar.skylanex.com
#
# No www variant: www.altar.skylanex.com has no DNS record and no wildcard
# covers it, so adding it to -d would fail validation and take the whole
# certificate request down with it.
#
# altar.camp is NOT served here yet. It is registered and points at Bluehost;
# when its A record moves to this box, add it to `server_name` in both blocks
# and re-run certbot with `-d altar.skylanex.com -d altar.camp`.

server {
    listen 80;
    listen [::]:80;
    server_name altar.skylanex.com;

    # `^~` is load-bearing. nginx matches regex locations before plain prefix
    # ones, so the dotfile-deny block below would otherwise claim this path and
    # renewals would 403.
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://altar.skylanex.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name altar.skylanex.com;

    ssl_certificate /etc/letsencrypt/live/altar.skylanex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/altar.skylanex.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # A signed contract is a PDF the artist downloads, so the body limit has to
    # clear a document rather than a form post.
    client_max_body_size 25m;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    # The API, first-party. `proxy_cookie_path` is deliberately absent: the
    # session cookie is already issued for / and rewriting it here is how a
    # login silently stops sticking.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Contract generation and PDF rendering are slower than a page load.
        proxy_read_timeout 120s;
    }

    # The API's own interactive docs, same origin so they can call it.
    location ^~ /docs {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the SPA, served by the web container's own nginx, which
    # already does the index.html fallback and the fingerprinted-asset caching.
    location / {
        proxy_pass http://127.0.0.1:5190;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\. { deny all; }
}
