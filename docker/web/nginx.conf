server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed assets are immutable; the shell is not.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # The API is reached through the same origin, so the session cookie is first-party.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 25m;
  }

  location /docs {
    proxy_pass http://api:4000/docs;
    proxy_set_header Host $host;
  }

  location /health {
    proxy_pass http://api:4000/health;
    proxy_set_header Host $host;
  }

  # Single-page app: unknown paths render the shell, which routes client-side.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
